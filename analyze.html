<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KickTracker App</title>
    <!-- Physics Engine -->
    <script src="physics-engine.js"></script>
    <!-- Load OpenCV.js -->
    <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript" onload="onOpenCvReady();"></script>
    <style>
        /* All your existing CSS styling remains exactly the same */
        body { font-family: -apple-system, sans-serif; margin: 0; background-color: #000; color: #fff; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; box-sizing: border-box; }
        .sys-buttons { display: flex; justify-content: flex-end; gap: 8px; padding: 10px; background-color: #1c1c1e; }
        .sys-buttons button { padding: 6px 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        #btn-home { background: #007aff; color: white; margin-right: auto; }
        #btn-reset { background: #3a3a3c; color: white; }
        #file-upload { display: none; }
        .dashboard { background-color: #1c1c1e; padding: 10px 16px; display: flex; flex-direction: column; gap: 10px; }
        .row { display: flex; align-items: center; gap: 10px; justify-content: center; }
        input[type="range"] { padding: 4px; border-radius: 4px; background: #2c2c2e; flex-grow: 1; }
        .results-box { background-color: #2c2c2e; padding: 8px; border-radius: 8px; font-weight: bold; font-size: 14px; text-align: center; color: #007aff; }
        .viewport-container { flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
        .zoom-wrapper { position: relative; display: inline-flex; max-width: 100%; max-height: 100%; transform-origin: center center; }
        video { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
        canvas { position: absolute; top: 0; left: 0; touch-action: none; }
        .upload-placeholder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; color: #8e8e93; cursor: pointer; border: 2px dashed #3a3a3c; padding: 30px; border-radius: 12px; }
        .controls { background-color: #1c1c1e; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .playback-row { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .playback-row button { background: #2c2c2e; border: none; color: white; font-size: 14px; font-weight: bold; cursor: pointer; padding: 8px 16px; border-radius: 6px; }
        .workflow-bar { background-color: #1c1c1e; padding: 15px; display: flex; justify-content: center; }
        .workflow-btn { width: 100%; padding: 16px; font-size: 18px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; color: white; background: #3a3a3c; }
        #report-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; }
        .report-content { background: #1c1c1e; width: 90%; max-width: 400px; border-radius: 16px; padding: 20px; }
        .report-section { background: #2c2c2e; border-radius: 10px; padding: 10px 15px; margin-bottom: 15px; }
        .report-header { font-weight: bold; margin-bottom: 10px; font-size: 14px; color: #8e8e93; }
        .report-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 16px; border-bottom: 1px solid #3a3a3c; padding-bottom: 8px;}
        .report-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .text-green { color: #34c759; font-weight: bold; }
        .text-orange { color: #ff9500; font-weight: bold; }
        .btn-close-modal { width: 100%; padding: 14px; background: #007aff; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="sys-buttons">
        <button id="btn-home" onclick="window.location.href='index.html'">Home</button>
        <button id="btn-reset" onclick="resetAll()">Reset App</button>
        <button id="btn-new" onclick="document.getElementById('file-upload').click()">New Video</button>
        <input type="file" id="file-upload" accept="video/*">
    </div>

    <div class="dashboard">
        <div class="row" style="font-size: 14px; font-weight: bold;">
            Cam Depth (Yds): <span id="depth-val">15</span>
            <input type="range" id="cam-depth" min="5" max="50" step="1" value="15">
        </div>
        <div class="results-box" id="status-text">OpenCV Loading...</div>
    </div>

    <div class="viewport-container">
        <div class="upload-placeholder" id="upload-placeholder" onclick="document.getElementById('file-upload').click()" style="pointer-events: none; opacity: 0.5;">
            Upload Video (Waiting for CV)
        </div>
        
        <div class="zoom-wrapper" id="zoom-wrapper" style="display: none;">
            <video id="video-player" playsinline muted></video>
            <canvas id="overlay"></canvas>
        </div>
    </div>

    <!-- Hidden canvas for OpenCV processing -->
    <canvas id="cv-canvas" style="display: none;"></canvas>

    <div class="controls" id="persistent-controls" style="display: none;">
        <div class="row" style="padding: 0 10px;">
            <span style="font-size: 12px; font-weight: bold; width: 45px;">Zoom:</span>
            <input type="range" id="zoom-slider" min="1" max="10" step="0.1" value="1">
            <span id="zoom-val" style="font-size: 12px; width: 35px; text-align: right;">1x</span>
        </div>

        <div id="playback-controls">
            <input type="range" id="scrubber" min="0" max="1" step="0.01" value="0" style="width: 100%; margin-bottom: 10px;">
            <div class="playback-row">
                <button onclick="stepFrame(-1)">-1 Fr</button>
                <button id="btn-playpause" onclick="togglePlay()" style="font-size: 18px; padding: 6px 20px;">⏸</button>
                <button onclick="stepFrame(1)">+1 Fr</button>
            </div>
        </div>
    </div>

    <div class="workflow-bar">
        <button id="btn-workflow" class="workflow-btn" disabled>Awaiting Video...</button>
    </div>

    <div id="report-modal">
        <div class="report-content">
            <h2 style="text-align:center; margin-top:0;">Actuarial Report</h2>
            <div class="report-section">
                <div class="report-header">Scoring Projection</div>
                <div class="report-row"><span>Good From</span> <span class="text-green" id="rep-max">≤ 0 yds</span></div>
                <div class="report-row"><span>Drift Profile</span> <span id="rep-miss" style="font-weight:bold;">--</span></div>
            </div>
            <div class="report-section">
                <div class="report-header">Kinematics</div>
                <div class="report-row"><span>Total Hang Time</span> <span id="rep-time" style="font-weight:bold;">--s</span></div>
                <div class="report-row"><span>Peak Height</span> <span id="rep-height" style="font-weight:bold;">-- ft</span></div>
                <div class="report-row"><span>Launch Angle</span> <span id="rep-angle" class="text-orange">--°</span></div>
            </div>
            <button class="btn-close-modal" onclick="document.getElementById('report-modal').style.display='none'">Close Report</button>
        </div>
    </div>

    <!-- Main Logic Script -->
    <script src="analyze.js"></script>
</body>
</html>
